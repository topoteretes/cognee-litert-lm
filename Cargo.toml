[package]
name = "cognee-litert-lm"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for the LiteRT-LM C++ inference engine"
license = "Apache-2.0"
repository = "https://github.com/topoteretes/cognee-litert-lm"
readme = "README.md"

[lib]
name = "cognee_litert_lm"

[features]
default = ["async-constraint-masking"]
# Build the C++ library from source via CMake. Requires all C++ dependencies.
build-from-source = ["cmake"]
# Enable speculative structured output generation with async constraint masking on GPU.
async-constraint-masking = []

[build-dependencies]
bindgen = "0.71"
cmake = { version = "0.1", optional = true }

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]

[[example]]
name = "simple_chat"
required-features = ["clap", "serde_json"]
